# Render Blueprint for the OBULU backend.
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Then set FOOTBALL_DATA_ORG_KEY in the dashboard (Environment tab).
services:
  - type: web
    name: obulu-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: FOOTBALL_DATA_ORG_KEY
        sync: false # set manually in the Render dashboard (secret)
      - key: SAMPLE_DATA
        value: "false"
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: AUTOMATION_DRY_RUN
        value: "true"
      - key: AUTOMATION_INTERVAL_MINUTES
        value: "30"
      - key: AUTOMATION_MIN_CONFIDENCE
        value: "75"
      - key: AUTOMATION_MIN_DATA_COMPLETENESS
        value: "70"
      - key: AUTOMATION_MIN_PROBABILITY
        value: "65"
      - key: AUTOMATION_MIN_OUTCOME_MARGIN
        value: "20"
      - key: AUTOMATION_MAX_ALERTS_PER_RUN
        value: "10"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: web
    name: obulu-web
    runtime: static
    plan: free
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_URL
        value: https://obulu-api.onrender.com
