server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (HashRouter means /index.html always loads; this is belt-and-suspenders)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse-proxy: point at the real backend host in production.
    # Disabled by default — uncomment and adjust when the API lives elsewhere.
    # location /api/ {
    #     proxy_pass http://backend:3001;
    # }
}
